<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartWaste AI - Klasifikasi Sampah Cerdas</title>
    <!-- Google Fonts untuk mempercantik tampilan -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .main-container {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .header h1 {
            font-size: 24px;
            color: #2c3e50;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .header p {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 20px;
        }
        .camera-box {
            position: relative;
            width: 100%;
            height: 360px;
            background: #000;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .btn-container {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .btn {
            flex: 1;
            padding: 12px 15px;
            font-size: 15px;
            font-weight: 500;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-toggle {
            background-color: #34495e;
        }
        .btn-toggle:hover {
            background-color: #2c3e50;
        }
        .btn-capture {
            background-color: #27ae60;
        }
        .btn-capture:hover {
            background-color: #219653;
        }
        #result {
            margin-top: 15px;
            font-size: 15px;
            font-weight: 500;
            color: #2c3e50;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="header">
            <h1>SmartWaste AI</h1>
            <p>Sistem Deteksi dan Klasifikasi Sampah Otomatis</p>
        </div>
        
        <!-- Kotak Tampilan Kamera -->
        <div class="camera-box">
            <video id="video" autoplay playsinline></video>
        </div>
        
        <!-- Tombol Aksi -->
        <div class="btn-container">
            <button class="btn btn-toggle" onclick="switchCamera()">
                🔄 Tukar Kamera
            </button>
            <button class="btn btn-capture" onclick="captureImage()">
                📸 Deteksi
            </button>
        </div>
        
        <canvas id="canvas" style="display: none;"></canvas>
        <div id="result"></div>
    </div>

    <script>
        let useFrontCamera = false; // Default menggunakan kamera belakang (environment) di HP
        let currentStream = null;

        function startCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: {
                    facingMode: useFrontCamera ? "user" : "environment",
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }
            };

            navigator.mediaDevices.getUserMedia(constraints)
                .then(stream => {
                    currentStream = stream;
                    const videoElement = document.getElementById('video');
                    videoElement.srcObject = stream;
                })
                .catch(err => {
                    console.error("Gagal mengakses kamera: ", err);
                    alert("Tidak dapat mengakses kamera. Pastikan izin kamera telah diaktifkan.");
                });
        }

        // Fungsi untuk menukar kamera depan dan belakang
        function switchCamera() {
            useFrontCamera = !useFrontCamera;
            startCamera();
        }

        // Jalankan kamera otomatis saat halaman dibuka
        window.addEventListener('load', () => {
            startCamera();
        });

        // Fungsi contoh tangkap gambar untuk proses AI
        function captureImage() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            document.getElementById('result').innerText = "Menganalisis sampah...";
            // Di sini kamu bisa menambahkan logika fetch API untuk mengirim gambar ke backend Flask
        }
    </script>
</body>
</html>
