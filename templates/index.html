<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartWaste AI - Deteksi Sampah</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        h2 {
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        video {
            width: 100%;
            max-height: 400px;
            border-radius: 8px;
            background: #000;
            object-fit: cover;
        }
        .btn-group {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        button {
            padding: 10px 15px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: #fff;
        }
        #btnToggle {
            background-color: #3498db;
        }
        #btnToggle:hover {
            background-color: #2980b9;
        }
        #btnCapture {
            background-color: #2ecc71;
        }
        #btnCapture:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>SmartWaste AI Scanner</h2>
        
        <!-- Elemen Video Kamera -->
        <video id="video" autoplay playsinline></video>
        
        <div class="btn-group">
            <!-- Tombol Tukar Kamera -->
            <button id="btnToggle" onclick="switchCamera()">🔄 Tukar Kamera</button>
            <!-- Tombol Tangkap / Deteksi (Opsional) -->
            <button id="btnCapture" onclick="captureImage()">📸 Deteksi Sampah</button>
        </div>
        
        <canvas id="canvas" style="display: none;"></canvas>
        <div id="result" style="margin-top: 15px; font-weight: bold;"></div>
    </div>

    <script>
        let useFrontCamera = false; // Default menggunakan kamera belakang (environment)
        let currentStream = null;

        function startCamera() {
            // Hentikan stream kamera sebelumnya jika ada agar tidak bentrok
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: {
                    facingMode: useFrontCamera ? "user" : "environment",
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }
            };

            navigator.mediaDevices.getUserMedia(constraints)
                .then(stream => {
                    currentStream = stream;
                    const videoElement = document.getElementById('video');
                    videoElement.srcObject = stream;
                })
                .catch(err => {
                    console.error("Gagal mengakses kamera: ", err);
                    alert("Tidak dapat mengakses kamera. Pastikan izin kamera diizinkan di browser HP Anda.");
                });
        }

        // Fungsi untuk menukar kamera depan dan belakang
        function switchCamera() {
            useFrontCamera = !useFrontCamera;
            startCamera();
        }

        // Jalankan kamera saat halaman pertama kali dibuka
        window.addEventListener('load', () => {
            startCamera();
        });

        // Contoh fungsi tangkap gambar (jika ingin dikirim ke backend Flask)
        function captureImage() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Gambar berhasil diambil dan bisa dikirim ke backend Flask via fetch API di sini
            document.getElementById('result').innerText = "Memproses gambar...";
        }
    </script>
</body>
</html>
